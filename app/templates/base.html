<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Cravin — Zero Sugar, Zero Maida desserts from home bakers. AI-customized, nutrition-tracked, fresh & delivered.">
    <meta name="theme-color" content="#8B5CF6">

    <!-- PWA Manifest & App Icons -->
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/static/icons/icon.svg">
    <link rel="apple-touch-icon" href="/static/icons/icon.svg">

    <!-- iOS PWA Optimizations -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Cravin">

    <title>{% block title %}Cravin{% endblock %} — Zero Sugar, Full Flavor</title>
    <link rel="stylesheet" href="/static/css/design-system.css?v=9">
    {% block extra_css %}{% endblock %}
    <style>
        /* Page transition */
        .page-content {
            animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Universal Hide Scrollbars on Carousels */
        .no-scrollbar, .hide-scrollbar, .horizontal-carousel, .filter-container {
            -ms-overflow-style: none !important;
            scrollbar-width: none !important;
        }
        .no-scrollbar::-webkit-scrollbar,
        .hide-scrollbar::-webkit-scrollbar,
        .horizontal-carousel::-webkit-scrollbar,
        .filter-container::-webkit-scrollbar {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
            background: transparent !important;
        }

        /* ── Floating Capsule Bottom Navigation (Ultra-Luxe Pill) ─── */
        .bottom-nav {
            position: fixed !important;
            bottom: 16px !important;
            left: 50% !important;
            transform: translateX(-50%) !important;
            width: calc(100% - 24px) !important;
            max-width: 390px !important;
            background: rgba(15, 21, 35, 0.88) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            border-radius: 9999px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: space-around !important;
            padding: 6px 10px !important;
            padding-bottom: max(6px, env(safe-area-inset-bottom)) !important;
            z-index: 1000 !important;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.04) inset !important;
            backdrop-filter: blur(24px) !important;
            -webkit-backdrop-filter: blur(24px) !important;
        }

        .bottom-nav a {
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            gap: 2px !important;
            padding: 6px 8px !important;
            color: var(--text-tertiary) !important;
            font-size: 0.62rem !important;
            font-family: var(--font-display) !important;
            font-weight: 700 !important;
            text-decoration: none !important;
            letter-spacing: 0.06em !important;
            text-transform: uppercase !important;
            transition: all var(--duration-fast) var(--ease-spring) !important;
            min-width: 48px !important;
            justify-content: center !important;
            border-radius: 9999px !important;
            position: relative !important;
        }

        .bottom-nav a .nav-icon {
            font-size: 1.25rem !important;
            transition: transform var(--duration-fast) var(--ease-spring) !important;
        }

        .bottom-nav a.active {
            color: #FFFFFF !important;
        }

        .bottom-nav a.active .nav-icon {
            transform: translateY(-2px) !important;
            filter: drop-shadow(0 0 8px var(--jamun-glow)) !important;
        }

        .bottom-nav a.active::after {
            content: '' !important;
            position: absolute !important;
            bottom: 2px !important;
            width: 14px !important;
            height: 3px !important;
            border-radius: 9999px !important;
            background: linear-gradient(90deg, var(--jamun), var(--honey)) !important;
            box-shadow: 0 0 10px var(--jamun-glow) !important;
        }

        .bottom-nav a:hover {
            color: var(--text-primary) !important;
            background: rgba(255, 255, 255, 0.06) !important;
        }

        .bottom-nav a:active {
            transform: scale(0.92) !important;
        }

        /* ── High-Contrast Photo Tag Badges ── */
        .tag, .soft-tag {
            display: inline-flex !important;
            align-items: center !important;
            gap: 4px !important;
            padding: 3px 9px !important;
            border-radius: 9999px !important;
            font-family: inherit !important;
            font-weight: 700 !important;
            font-size: 0.68rem !important;
            letter-spacing: 0.04em !important;
            backdrop-filter: blur(10px) !important;
            -webkit-backdrop-filter: blur(10px) !important;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.6) !important;
        }
        .tag-light {
            background: rgba(6, 28, 20, 0.92) !important;
            color: #34D399 !important;
            border: 1px solid rgba(52, 211, 153, 0.5) !important;
        }
        .tag-balanced {
            background: rgba(32, 20, 4, 0.92) !important;
            color: #FBBF24 !important;
            border: 1px solid rgba(251, 191, 36, 0.5) !important;
        }
        .tag-heavy {
            background: rgba(28, 12, 42, 0.92) !important;
            color: #D8B4FE !important;
            border: 1px solid rgba(192, 132, 252, 0.5) !important;
        }
    </style>
</head>
<body>
    <!-- Dedicated Global Toast Container (Fixed Center Top) -->
    <div id="toast-container"></div>

    {% block body %}
    <div class="page">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </div>
    {% endblock %}

    {% block nav %}{% endblock %}

    <!-- PWA Install Banner -->
    <div id="pwa-install-banner" class="hidden" style="position: fixed; bottom: 84px; left: 16px; right: 16px; max-width: 480px; margin: 0 auto; z-index: 999; background: linear-gradient(135deg, var(--bg-surface), var(--bg-elevated)); border: 1px solid var(--jamun); border-radius: var(--radius-lg); padding: 12px 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); animation: fadeInUp 0.4s ease;">
        <div class="flex items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <img src="/static/icons/icon.svg" width="38" height="38" style="border-radius: 9px;" alt="Cravin">
                <div>
                    <div style="font-size: 0.88rem; font-weight: 700; color: white;">Install Cravin App</div>
                    <div style="font-size: 0.73rem; color: var(--text-secondary);">One-tap healthy dessert ordering</div>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button id="pwa-install-btn" class="btn btn-sm" style="background: var(--jamun); color: white; padding: 6px 14px; font-size: 0.78rem; font-weight: 700; border-radius: 9999px; border: none; cursor: pointer;">Install</button>
                <button onclick="dismissInstallBanner()" class="btn btn-ghost btn-sm" style="padding: 4px; color: var(--text-tertiary); font-size: 0.85rem; border: none; background: transparent; cursor: pointer;">✕</button>
            </div>
        </div>
    </div>

    <script>
        /* ── Shared JS Utilities ── */
        const API = {
            async fetch(url, options = {}) {
                const token = document.cookie.match(/access_token=([^;]+)/)?.[1];
                const defaults = {
                    headers: {
                        'Content-Type': 'application/json',
                        ...(token ? {'Authorization': `Bearer ${token}`} : {}),
                    },
                };
                const res = await fetch(url, {...defaults, ...options});
                if (res.status === 401) {
                    window.location.href = '/app/login';
                    return;
                }
                return res.json();
            },
            get(url) { return this.fetch(url); },
            post(url, data) { return this.fetch(url, {method: 'POST', body: JSON.stringify(data)}); },
        };

        /* Cart (localStorage) */
        const Cart = {
            KEY: 'cravin_cart',
            get() {
                return JSON.parse(localStorage.getItem(this.KEY) || '[]');
            },
            add(item) {
                const cart = this.get();
                const existing = cart.find(i => String(i.dessert_id) === String(item.dessert_id) && !i.customization);
                if (existing && !item.customization) {
                    existing.quantity += item.quantity || 1;
                } else {
                    cart.push(item);
                }
                localStorage.setItem(this.KEY, JSON.stringify(cart));
                this.updateBadge();
                if (typeof updateCardSteppers === 'function') updateCardSteppers();
            },
            remove(index) {
                const cart = this.get();
                cart.splice(index, 1);
                localStorage.setItem(this.KEY, JSON.stringify(cart));
                this.updateBadge();
                if (typeof updateCardSteppers === 'function') updateCardSteppers();
            },
            clear() {
                localStorage.removeItem(this.KEY);
                this.updateBadge();
                if (typeof updateCardSteppers === 'function') updateCardSteppers();
            },
            count() {
                return this.get().reduce((sum, i) => sum + i.quantity, 0);
            },
            getQuantity(dessertId) {
                const cart = this.get();
                const item = cart.find(i => String(i.dessert_id) === String(dessertId) && !i.customization);
                return item ? item.quantity : 0;
            },
            setQuantity(dessertId, delta, dessertData) {
                let cart = this.get();
                let item = cart.find(i => String(i.dessert_id) === String(dessertId) && !i.customization);
                if (item) {
                    item.quantity += delta;
                    if (item.quantity <= 0) {
                        cart = cart.filter(i => !(String(i.dessert_id) === String(dessertId) && !i.customization));
                    }
                } else if (delta > 0 && dessertData) {
                    cart.push({
                        dessert_id: String(dessertId),
                        name: dessertData.name,
                        price: Number(dessertData.price),
                        calories: Number(dessertData.calories || 0),
                        quantity: delta
                    });
                }
                localStorage.setItem(this.KEY, JSON.stringify(cart));
                this.updateBadge();
                if (typeof updateCardSteppers === 'function') updateCardSteppers();
                return this.getQuantity(dessertId);
            },
            updateBadge() {
                const badges = document.querySelectorAll('.cart-badge');
                const count = this.count();
                badges.forEach(b => {
                    b.textContent = count;
                    b.style.display = count > 0 ? 'flex' : 'none';
                });
            }
        };

        // Update cart badge on page load
        document.addEventListener('DOMContentLoaded', () => Cart.updateBadge());

        /* ── Unified Global Toast Notification System (No Displacement / Glitch-Free) ── */
        function showToast(message, type = 'success', duration = 3000) {
            let container = document.getElementById('toast-container');
            if (!container) {
                container = document.createElement('div');
                container.id = 'toast-container';
                document.body.appendChild(container);
            }

            // Remove excessive active toasts (keep max 2)
            while (container.children.length >= 2) {
                container.removeChild(container.firstChild);
            }

            const toast = document.createElement('div');
            toast.className = `cravin-toast cravin-toast-${type}`;

            let icon = '✨';
            let borderColor = 'var(--jamun)';
            let bgColor = 'rgba(139, 92, 246, 0.15)';
            let textColor = '#FFFFFF';

            if (type === 'success') {
                icon = '✅';
                borderColor = 'rgba(16, 185, 129, 0.6)';
                bgColor = 'rgba(16, 185, 129, 0.18)';
                textColor = '#34D399';
            } else if (type === 'danger' || type === 'error') {
                icon = '⚠️';
                borderColor = 'rgba(239, 68, 68, 0.6)';
                bgColor = 'rgba(239, 68, 68, 0.18)';
                textColor = '#F87171';
            } else if (type === 'warning') {
                icon = '⏳';
                borderColor = 'rgba(245, 158, 11, 0.6)';
                bgColor = 'rgba(245, 158, 11, 0.18)';
                textColor = '#FCD34D';
            }

            toast.style.cssText = `
                pointer-events: auto;
                background: #111116;
                background-image: linear-gradient(135deg, ${bgColor}, rgba(17, 17, 22, 0.98));
                color: #FFFFFF;
                border: 1px solid ${borderColor};
                border-radius: 9999px;
                padding: 10px 20px;
                font-size: 0.86rem;
                font-weight: 600;
                display: inline-flex;
                align-items: center;
                gap: 8px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), 0 0 12px rgba(0,0,0,0.4);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
                opacity: 0;
                transform: translateY(-10px) scale(0.96);
                transition: opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1), transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
                user-select: none;
                max-width: 90vw;
                text-align: center;
            `;

            toast.innerHTML = `<span style="font-size: 1rem; flex-shrink: 0;">${icon}</span> <span>${message}</span>`;
            container.appendChild(toast);

            // Trigger smooth vertical entrance
            requestAnimationFrame(() => {
                toast.style.opacity = '1';
                toast.style.transform = 'translateY(0) scale(1)';
            });

            // Smooth exit
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-6px) scale(0.96)';
                setTimeout(() => {
                    if (toast.parentNode) {
                        toast.parentNode.removeChild(toast);
                    }
                }, 250);
            }, duration);
        }

        /* ── PWA Service Worker & Install Prompt ── */
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW notice:', err));
            });
        }

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const banner = document.getElementById('pwa-install-banner');
            const dismissed = sessionStorage.getItem('cravin_pwa_dismissed');
            if (banner && !dismissed) {
                banner.classList.remove('hidden');
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            const installBtn = document.getElementById('pwa-install-btn');
            if (installBtn) {
                installBtn.addEventListener('click', async () => {
                    if (deferredPrompt) {
                        deferredPrompt.prompt();
                        const { outcome } = await deferredPrompt.userChoice;
                        deferredPrompt = null;
                        document.getElementById('pwa-install-banner')?.classList.add('hidden');
                    }
                });
            }
        });

        function dismissInstallBanner() {
            document.getElementById('pwa-install-banner')?.classList.add('hidden');
            sessionStorage.setItem('cravin_pwa_dismissed', 'true');
        }
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
