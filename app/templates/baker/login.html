{% extends "base.html" %}
{% block title %}Baker Login{% endblock %}

{% block content %}
<div class="page-content" style="display: flex; flex-direction: column; justify-content: center; min-height: 90vh; padding-top: var(--space-4); padding-bottom: 96px;">
    <div class="text-center mb-8">
        <div style="font-size: 3rem; margin-bottom: var(--space-4);">🧑‍🍳</div>
        <h1 style="font-size: 2rem;">Baker Portal</h1>
        <p class="text-subtitle">Crav<span style="color: var(--honey);">in</span> — Home Baker Network</p>
    </div>

    <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" class="form-input" id="email" placeholder="your@email.com" required>
        </div>
        <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" class="form-input" id="password" required>
        </div>
        <button type="submit" class="btn btn-secondary btn-block btn-lg" id="login-btn">Sign In</button>
    </form>

    <div class="text-center mt-6">
        <p class="text-muted" style="font-size: 0.85rem; margin: 0;">Want to join as a baker? <a href="/baker/apply" style="font-weight: 700; color: var(--jamun-light);">Apply here</a></p>
    </div>

    <div class="text-center mt-5 pt-3" style="border-top: 1px dashed var(--border-subtle);">
        <p class="text-muted" style="font-size: 0.82rem; margin: 0;">
            🍩 <a href="/app/" style="color: var(--honey-light); font-weight: 600;">Guest Portal</a> &nbsp;·&nbsp; 🛠️ <a href="/admin/login" style="color: var(--text-tertiary); font-weight: 600;">Admin Hub</a>
        </p>
    </div>

</div>
{% endblock %}

{% block extra_js %}
<script>
async function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    btn.textContent = 'Signing in...';
    btn.disabled = true;
    try {
        const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({email: document.getElementById('email').value, password: document.getElementById('password').value}),
        });
        const data = await res.json();
        if (res.ok) { window.location.href = '/baker/'; }
        else { showToast(data.detail || 'Login failed', 'danger'); btn.textContent = 'Sign In'; btn.disabled = false; }
    } catch (err) { showToast('Connection error', 'danger'); btn.textContent = 'Sign In'; btn.disabled = false; }
}
</script>
{% endblock %}
