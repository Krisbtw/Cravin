{% extends "base.html" %}
{% block title %}Baker Applicants{% endblock %}

{% block extra_css %}
<style>
    .admin-container { max-width: 1000px; margin: 0 auto; padding: 0 var(--space-6); }
    .admin-nav { display: flex; gap: var(--space-2); margin-bottom: var(--space-6); overflow-x: auto; padding-bottom: var(--space-2); }
    .admin-nav a { padding: var(--space-2) var(--space-4); border-radius: var(--radius-full); font-size: 0.85rem; font-weight: 600; background: var(--malai-deep); color: var(--charcoal); text-decoration: none; white-space: nowrap; }
    .admin-nav a.active { background: var(--jamun); color: var(--white); }
</style>
{% endblock %}

{% block body %}
<div class="page">
    <div class="admin-container">
        <div class="top-bar">
            <div class="logo">Crav<span style="color: var(--honey);">in</span> <span style="font-weight: 400; font-size: 0.9rem; color: var(--warm-gray);">Admin</span></div>
            <a href="/api/auth/logout" class="btn btn-ghost btn-sm" onclick="document.cookie='access_token=;max-age=0';">Logout</a>
        </div>
        <nav class="admin-nav">
            <a href="/admin/">📊 Dashboard</a>
            <a href="/admin/applicants" class="active">👥 Applicants</a>
            <a href="/admin/bakers">🧑‍🍳 Bakers</a>
            <a href="/admin/orders">📦 Orders</a>
            <a href="/admin/recipes">🍰 Recipes</a>
        </nav>

        <h2 class="mb-4">Baker Applications</h2>
        <div id="applicants-list"></div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
async function loadApplicants() {
    const data = await API.get('/api/admin/applicants');
    if (!data || !data.length) {
        document.getElementById('applicants-list').innerHTML = '<div class="text-center p-6"><p class="text-muted">No pending applications</p></div>';
        return;
    }
    document.getElementById('applicants-list').innerHTML = data.map(a => `
        <div class="card mb-4 animate-fade-in-up" style="border: 1px solid var(--cream-border);">
            <div class="card-body">
                <div class="flex items-center justify-between mb-3">
                    <div>
                        <h3 style="font-size: 1.1rem;">${a.name}</h3>
                        <p class="text-muted" style="font-size: 0.85rem;">${a.email} · ${a.business_name || 'No business name'}</p>
                    </div>
                    <span class="tag tag-balanced">${a.status.replace('_', ' ')}</span>
                </div>
                <div class="flex flex-wrap gap-2 mb-3">
                    ${(a.skills || []).map(s => `<span class="tag" style="background: var(--pista-bg); color: var(--pista-dark);">${s}</span>`).join('')}
                </div>
                <div class="flex gap-2 mb-2" style="font-size: 0.85rem;">
                    <span>📍 ${a.city || '—'}, ${a.area || ''}</span>
                    <span>· FSSAI: ${a.fssai_number || 'Not provided'}</span>
                </div>
                <div class="flex gap-2 mt-3">
                    <button class="btn btn-primary btn-sm" onclick="updateStatus('${a.baker_id}', 'approved')">✅ Approve</button>
                    <button class="btn btn-outline btn-sm" onclick="updateStatus('${a.baker_id}', 'interview_scheduled')">📅 Schedule Interview</button>
                    <button class="btn btn-ghost btn-sm" onclick="updateStatus('${a.baker_id}', 'rejected')" style="color: var(--danger);">✕ Reject</button>
                </div>
            </div>
        </div>
    `).join('');
}

async function updateStatus(bakerId, status) {
    const res = await fetch(`/api/admin/applicants/${bakerId}/status?new_status=${status}`, {method: 'POST'});
    const data = await res.json();
    if (res.ok) { showToast(data.message); loadApplicants(); }
    else { showToast(data.detail || 'Failed', 'danger'); }
}

document.addEventListener('DOMContentLoaded', loadApplicants);
</script>
{% endblock %}
