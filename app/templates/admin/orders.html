{% extends "base.html" %}
{% block title %}Orders{% endblock %}

{% block extra_css %}
<style>
    .admin-container { max-width: 1000px; margin: 0 auto; padding: 0 var(--space-6); }
    .admin-nav { display: flex; gap: var(--space-2); margin-bottom: var(--space-6); overflow-x: auto; }
    .admin-nav a { padding: var(--space-2) var(--space-4); border-radius: var(--radius-full); font-size: 0.85rem; font-weight: 600; background: var(--malai-deep); color: var(--charcoal); text-decoration: none; }
    .admin-nav a.active { background: var(--jamun); color: var(--white); }
    .status-filters { display: flex; gap: var(--space-2); margin-bottom: var(--space-4); overflow-x: auto; }
    .status-filters button { padding: var(--space-1) var(--space-3); border: 1px solid var(--cream-border); border-radius: var(--radius-full); font-size: 0.8rem; background: var(--white); cursor: pointer; }
    .status-filters button.active { background: var(--jamun); color: white; border-color: var(--jamun); }
</style>
{% endblock %}

{% block body %}
<div class="page">
    <div class="admin-container">
        <div class="top-bar">
            <div class="logo">Crav<span style="color: var(--honey);">in</span> <span style="font-weight: 400; font-size: 0.9rem; color: var(--warm-gray);">Admin</span></div>
            <a href="/api/auth/logout" class="btn btn-ghost btn-sm" onclick="document.cookie='access_token=;max-age=0';">Logout</a>
        </div>
        <nav class="admin-nav">
            <a href="/admin/">📊 Dashboard</a><a href="/admin/applicants">👥 Applicants</a>
            <a href="/admin/bakers">🧑‍🍳 Bakers</a><a href="/admin/orders" class="active">📦 Orders</a><a href="/admin/recipes">🍰 Recipes</a>
        </nav>
        <h2 class="mb-4">Order Operations</h2>
        <div class="status-filters">
            <button class="active" onclick="filterOrders(null, this)">All</button>
            <button onclick="filterOrders('placed', this)">Placed</button>
            <button onclick="filterOrders('accepted', this)">Accepted</button>
            <button onclick="filterOrders('preparing', this)">Preparing</button>
            <button onclick="filterOrders('delivered', this)">Delivered</button>
            <button onclick="filterOrders('cancelled', this)">Cancelled</button>
        </div>
        <div id="orders-list"></div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
async function loadOrders(status) {
    const url = status ? `/api/admin/orders?status=${status}` : '/api/admin/orders';
    const data = await API.get(url);
    if (!data || !data.length) { document.getElementById('orders-list').innerHTML = '<p class="text-muted text-center p-6">No orders</p>'; return; }
    document.getElementById('orders-list').innerHTML = data.map(o => `
        <div class="card mb-2" style="border: 1px solid var(--cream-border);">
            <div class="card-body flex items-center justify-between">
                <div>
                    <span style="font-weight: 700;">#${o.order_number}</span>
                    <span class="text-muted" style="font-size: 0.8rem;"> · ${o.fulfillment_type}</span>
                </div>
                <div class="flex items-center gap-3">
                    <span style="font-weight: 600;">₹${Math.round(o.total_amount)}</span>
                    <span class="tag tag-${o.status === 'delivered' ? 'light' : o.status === 'cancelled' ? 'heavy' : 'balanced'}" style="font-size: 0.65rem;">${o.status.replace('_', ' ')}</span>
                </div>
            </div>
        </div>
    `).join('');
}
function filterOrders(status, btn) {
    document.querySelectorAll('.status-filters button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    loadOrders(status);
}
document.addEventListener('DOMContentLoaded', () => loadOrders(null));
</script>
{% endblock %}
