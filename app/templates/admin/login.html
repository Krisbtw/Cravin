{% extends "base.html" %}
{% block title %}Admin Login{% endblock %}

{% block content %}
<div class="page-content" style="display: flex; flex-direction: column; justify-content: center; min-height: 90vh; padding-top: var(--space-4); padding-bottom: 96px;">
    <div class="text-center mb-8">
        <div style="font-size: 3rem; margin-bottom: var(--space-4);">🛠️</div>
        <h1 style="font-size: 2rem;">Admin Panel</h1>
        <p class="text-subtitle">Crav<span style="color: var(--honey);">in</span> Operations</p>
    </div>
    <form onsubmit="handleLogin(event)">
        <div class="form-group"><label class="form-label">Email</label><input type="email" class="form-input" id="email" required></div>
        <div class="form-group"><label class="form-label">Password</label><input type="password" class="form-input" id="password" required></div>
        <button type="submit" class="btn btn-secondary btn-block btn-lg" id="login-btn">Sign In</button>
    </form>

    <div class="text-center mt-5 pt-3" style="border-top: 1px dashed var(--border-subtle);">
        <p class="text-muted" style="font-size: 0.82rem; margin: 0;">
            🍩 <a href="/app/" style="color: var(--honey-light); font-weight: 600;">Guest Portal</a> &nbsp;·&nbsp; 🧑‍🍳 <a href="/baker/login" style="color: var(--jamun-light); font-weight: 600;">Baker Kitchen Portal</a>
        </p>
    </div>

</div>
{% endblock %}

{% block extra_js %}
<script>
async function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    btn.textContent = 'Signing in...'; btn.disabled = true;
    try {
        const res = await fetch('/api/auth/login', {method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({email: document.getElementById('email').value, password: document.getElementById('password').value})});
        if (res.ok) { window.location.href = '/admin/'; }
        else { const d = await res.json(); showToast(d.detail || 'Failed', 'danger'); btn.textContent = 'Sign In'; btn.disabled = false; }
    } catch(e) { showToast('Error', 'danger'); btn.textContent = 'Sign In'; btn.disabled = false; }
}
</script>
{% endblock %}
